# Guides publish on a schedule: each row carries a date and the site reveals it
# on that day, with no robot involved. Visitors see a new guide the moment its
# date arrives, because the page fetches from Supabase in the browser.
#
# Crawlers do not. The HTML Google reads is prerendered at build time and the
# sitemap is generated at build time too, so between deploys a guide that went
# live is missing from the sitemap and has no static page of its own.
#
# This runs the real build once a day and commits the regenerated fallback
# sitemap when it differs. The commit is the point: pushing to main is what makes
# Vercel rebuild, refreshing the prerendered HTML and the live sitemap together.
# On a day when nothing changed there is no commit and no deploy.
name: Daily sitemap and content snapshot

on:
  schedule:
    # 03:10 UTC = 06:10 Israel, just after the date_published gate rolls over,
    # and off the hour so it is not queued behind every other cron on GitHub.
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # supabase-js constructs a realtime client on createClient, and that needs
      # a native WebSocket. Node 20 has none, so the client threw before a single
      # query ran, both the prerender and the sitemap took their soft-fail path,
      # and the job went green having refreshed nothing. 22 is the first release
      # with WebSocket built in, and matches what the site is developed against.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Without these the sitemap step cannot read the guides table, and the
      # build quietly keeps the sitemap already in the repo — which would make
      # this whole job a no-op that looks green. So check first and say so.
      - name: Check the Supabase credentials are present
        env:
          ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY is not set in this repository's Actions secrets."
            echo "Add it under Settings > Secrets and variables > Actions. It is the same"
            echo "public anon key the site already ships in its client bundle, not the"
            echo "service role key, which must never be placed here."
            exit 1
          fi

      # Both the prerender and the sitemap step fail soft: unreachable Supabase
      # keeps the shipped files rather than emitting empty ones. That is right
      # for a laptop with no network and wrong here, where a build that quietly
      # kept yesterday's sitemap is the exact no-op this job exists to prevent.
      # A credential that is merely present is not a credential that works, so
      # the run is failed on the fallback messages themselves.
      - name: Build and regenerate the sitemap
        env:
          VITE_SUPABASE_URL: https://beobkcttzwiqcawrprgg.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -q "Skipping sitemap regeneration" build.log; then
            echo "::error::The build could not read Supabase, so the sitemap was not regenerated and this run would have published nothing. Check the error above the message: usually the anon key is wrong or the project is paused."
            exit 1
          fi
          if grep -q "Skipping prerender" build.log; then
            echo "::error::The build could not read Supabase, so no page was prerendered. Crawlers would be served an empty shell."
            exit 1
          fi

      # Every word on the site lives in Supabase and nowhere else. The runner is
      # already holding working credentials at this point, so it costs one step
      # to keep a copy in the repository, and git keeps every earlier version.
      - name: Snapshot the site content
        env:
          VITE_SUPABASE_URL: https://beobkcttzwiqcawrprgg.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/backup-content.mjs

      - name: Commit the sitemap and the snapshot when they changed
        run: |
          cp dist/sitemap.xml public/sitemap.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then ask. `git diff` reports a brand new file as no
          # change at all, so checking before staging made the very first
          # snapshot look identical to nothing and skipped committing it.
          git add public/sitemap.xml backups/
          if git diff --cached --quiet; then
            echo "Sitemap and content snapshot unchanged; nothing to publish today."
            exit 0
          fi
          git commit -m "Refresh the sitemap and the content snapshot"
          git push
